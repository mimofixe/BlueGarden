<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="s9AA3B2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/></marker><marker id="r9AA3B2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9AA3B2"/></marker><marker id="s4A5568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker><marker id="r4A5568" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4A5568"/></marker><marker id="sB86E1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B86E1F"/></marker><marker id="rB86E1F" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B86E1F"/></marker><marker id="s6B57A8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B57A8"/></marker><marker id="r6B57A8" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#6B57A8"/></marker><marker id="s3C8D63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3C8D63"/></marker><marker id="r3C8D63" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3C8D63"/></marker><marker id="s2F5DA8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F5DA8"/></marker><marker id="r2F5DA8" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2F5DA8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="800.0" y="52" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2A44">Segurança no Blue Garden</text><text x="800.0" y="82" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16.5" font-weight="400" text-anchor="middle" fill="#4A5568">o que protege cada passo de um pedido</text><rect x="40.0" y="374.0" width="220" height="92" rx="12" fill="#F1F3F6" stroke="#7C8596" stroke-width="1.8"/><text x="150" y="416.02500000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Browser</text><text x="150" y="434.87500000000006" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">guarda o token JWT</text><rect x="330.0" y="345.0" width="300" height="150" rx="12" fill="#DCE6F5" stroke="#2F5DA8" stroke-width="1.8"/><text x="480" y="389.7" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Nginx</text><text x="480" y="408.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">único serviço exposto (80/443)</text><text x="480" y="426.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">HTTPS com TLS 1.2 e 1.3</text><text x="480" y="443.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">HSTS · nosniff</text><text x="480" y="461.20000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">X-Frame-Options: DENY</text><path d="M261,420 L328,420" fill="none" stroke="#2F5DA8" stroke-width="2.6" marker-end="url(#s2F5DA8)" stroke-linejoin="round"/><text x="294" y="406" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2F5DA8">HTTPS</text><rect x="680" y="130" width="880" height="700" rx="16" fill="none" stroke="#7C8596" stroke-width="1.5" stroke-dasharray="7 6"/><text x="698" y="156" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1F2A44">Rede interna do Docker</text><text x="698" y="176" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4A5568">sem portas abertas para fora</text><rect x="745.0" y="207.0" width="330" height="96" rx="12" fill="#DCE6F5" stroke="#2F5DA8" stroke-width="1.8"/><text x="910" y="242.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Contas</text><text x="910" y="261.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">password guardada com bcrypt</text><text x="910" y="278.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">login devolve um JWT (HS256, 120 min)</text><rect x="745.0" y="382.0" width="330" height="116" rx="12" fill="#DCE6F5" stroke="#2F5DA8" stroke-width="1.8"/><text x="910" y="418.475" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Autorização</text><text x="910" y="437.32500000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">cada pedido valida o JWT</text><text x="910" y="454.87500000000006" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">as consultas filtram pelo utilizador_id</text><text x="910" y="472.42500000000007" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">(cada um só vê os seus ficheiros)</text><rect x="745.0" y="592.0" width="330" height="96" rx="12" fill="#DCE6F5" stroke="#2F5DA8" stroke-width="1.8"/><text x="910" y="627.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Cifra dos ficheiros</text><text x="910" y="646.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">Fernet: AES-128-CBC + HMAC-SHA256</text><text x="910" y="663.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">em memória, antes de guardar</text><path d="M1205.0,238.0 L1205.0,332.0 A135.0,9 0 0 0 1475.0,332.0 L1475.0,238.0 A135.0,9 0 0 0 1205.0,238.0 Z" fill="#ECE6F7" stroke="#6B57A8" stroke-width="1.8"/><ellipse cx="1340" cy="238.0" rx="135.0" ry="9" fill="#ECE6F7" stroke="#6B57A8" stroke-width="1.8"/><text x="1340" y="277.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2A44">MongoDB</text><text x="1340" y="295.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#4A5568">contas (só o hash)</text><text x="1340" y="311.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#4A5568">metadados e fila da IA</text><rect x="1205.0" y="428.0" width="270" height="84" rx="12" fill="#FCEBD7" stroke="#B86E1F" stroke-width="1.8"/><text x="1340" y="457.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Worker de IA</text><text x="1340" y="476.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">decifra só para analisar</text><text x="1340" y="493.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">sem serviços externos</text><path d="M1205.0,603.0 L1205.0,697.0 A135.0,9 0 0 0 1475.0,697.0 L1475.0,603.0 A135.0,9 0 0 0 1205.0,603.0 Z" fill="#DFF2E7" stroke="#3C8D63" stroke-width="1.8"/><ellipse cx="1340" cy="603.0" rx="135.0" ry="9" fill="#DFF2E7" stroke="#3C8D63" stroke-width="1.8"/><text x="1340" y="642.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2A44">MinIO</text><text x="1340" y="660.1999999999999" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#4A5568">só recebe ficheiros cifrados</text><text x="1340" y="676.4" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#4A5568">(foto de perfil também)</text><path d="M631,385 L743,270" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><text x="700" y="300" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="end" fill="#3A4458">registo / login</text><path d="M631,440 L743,440" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><text x="687" y="428" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3A4458">pedidos</text><path d="M910,499 L910,590" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><text x="922" y="550" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#3A4458">upload</text><path d="M1076,640 L1202,645" fill="none" stroke="#3C8D63" stroke-width="2" marker-end="url(#s3C8D63)" stroke-linejoin="round"/><path d="M1076,255 L1202,270" fill="none" stroke="#6B57A8" stroke-width="1.8" marker-end="url(#s6B57A8)" stroke-linejoin="round"/><path d="M1076,425 L1202,310" fill="none" stroke="#6B57A8" stroke-width="1.8" marker-end="url(#s6B57A8)" stroke-linejoin="round"/><path d="M1340,592 L1340,514" fill="none" stroke="#B86E1F" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#sB86E1F)" stroke-linejoin="round"/><text x="1352" y="560" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#B86E1F">lê</text><text x="1120" y="800" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#4A5568">Limitações: há uma só chave de cifra; a consola do MinIO (9001) fica aberta só para a demo;</text><text x="1120" y="818" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#4A5568">o certificado HTTPS é autoassinado.</text><path d="M70,610 L514,610 L530,626 L530,750 L70,750 Z" fill="#fff" stroke="#7C8596" stroke-width="1.6"/><path d="M514,610 L514,626 L530,626" fill="none" stroke="#7C8596" stroke-width="1.6"/><text x="86" y="636" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1F2A44">.env (fora do GitHub)</text><text x="86" y="658.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4A5568">FERNET_CHAVE e JWT_SEGREDO, gerados pelo</text><text x="86" y="675.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4A5568">scripts/gerar_env.sh.</text><text x="86" y="693.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4A5568">Se a FERNET_CHAVE se perder, os ficheiros deixam</text><text x="86" y="710.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4A5568">de poder ser decifrados: é preciso uma cópia</text><text x="86" y="728.2" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4A5568">de segurança fora do sistema.</text><path d="M530,680 L743,650" fill="none" stroke="#9AA3B2" stroke-width="1.8" stroke-dasharray="3 4" stroke-linejoin="round"/></svg>