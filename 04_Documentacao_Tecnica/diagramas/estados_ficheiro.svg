<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790"><defs><marker id="s4A5568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker><marker id="r4A5568" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4A5568"/></marker><marker id="s3C8D63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3C8D63"/></marker><marker id="r3C8D63" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3C8D63"/></marker><marker id="sB23A3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B23A3A"/></marker><marker id="rB23A3A" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B23A3A"/></marker><marker id="s2F5DA8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F5DA8"/></marker><marker id="r2F5DA8" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2F5DA8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="800.0" y="52" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2A44">Estados de um ficheiro</text><text x="800.0" y="82" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16.5" font-weight="400" text-anchor="middle" fill="#4A5568">fila da IA (campo estado) e reciclagem (campo apagado), guardados no MongoDB</text><rect x="40" y="120" width="1000" height="640" rx="16" fill="#FFFCF8" stroke="#B86E1F" stroke-width="1.5"/><text x="58" y="146" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1F2A44">Fila da IA</text><circle cx="80" cy="280" r="11" fill="#1F2A44"/><path d="M92,280 L156,280" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><text x="124" y="262" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3A4458">upload</text><rect x="160.0" y="238.0" width="240" height="84" rx="12" fill="#FCEBD7" stroke="#B86E1F" stroke-width="1.8"/><text x="280" y="276.02500000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">PENDENTE</text><text x="280" y="294.87500000000006" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">à espera do worker</text><rect x="550.0" y="231.0" width="300" height="98" rx="12" fill="#FCEBD7" stroke="#B86E1F" stroke-width="1.8"/><text x="700" y="267.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">EM_ANALISE</text><text x="700" y="286.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">apanhado por um só worker</text><text x="700" y="303.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">(find_one_and_update atómico)</text><rect x="550.0" y="511.0" width="300" height="98" rx="12" fill="#DFF2E7" stroke="#3C8D63" stroke-width="1.8"/><text x="700" y="547.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">CATEGORIZADO</text><text x="700" y="566.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">categoria + confiança</text><text x="700" y="583.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">ou «Por rever» (abaixo de 0,6)</text><rect x="145.0" y="511.0" width="270" height="98" rx="12" fill="#DCE6F5" stroke="#2F5DA8" stroke-width="1.8"/><text x="280" y="547.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">CATEGORIZADO (corrigido)</text><text x="280" y="566.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">confiança 1,0</text><text x="280" y="583.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">a IA não volta a mexer</text><path d="M400,266 L546,266" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><text x="473" y="254" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3A4458">o worker apanha-o</text><path d="M550,296 L404,296" fill="none" stroke="#B23A3A" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#sB23A3A)" stroke-linejoin="round"/><text x="477" y="352" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#B23A3A">volta à fila se o worker cair</text><text x="477" y="369" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#B23A3A">(ao fim de 5 min) ou se houver</text><text x="477" y="386" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#B23A3A">erro (até 3 tentativas)</text><path d="M700,329 L700,507" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><text x="714" y="422" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#3A4458">análise feita</text><text x="714" y="440" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4A5568">(à 3.ª falha vai para «Por rever»)</text><path d="M550,560 L419,560" fill="none" stroke="#2F5DA8" stroke-width="1.8" marker-end="url(#s2F5DA8)" stroke-linejoin="round"/><text x="484" y="546" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#2F5DA8">o utilizador corrige</text><path d="M280,322 L280,507" fill="none" stroke="#2F5DA8" stroke-width="1.8" stroke-dasharray="2 5" marker-end="url(#s2F5DA8)" stroke-linejoin="round"/><text x="266" y="420" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="end" fill="#2F5DA8">corrige antes</text><text x="266" y="437" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="end" fill="#2F5DA8">da IA</text><text x="540" y="715" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">O estado está na base de dados: se o worker falhar, nada se perde e a fila continua quando ele voltar.</text><rect x="1080" y="120" width="480" height="640" rx="16" fill="#FBFBFC" stroke="#7C8596" stroke-width="1.5"/><text x="1098" y="146" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#1F2A44">Reciclagem</text><rect x="1190.0" y="218.0" width="260" height="84" rx="12" fill="#F1F3F6" stroke="#7C8596" stroke-width="1.8"/><text x="1320" y="256.025" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Ativo</text><text x="1320" y="274.875" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">apagado: false</text><rect x="1170.0" y="401.0" width="300" height="98" rx="12" fill="#F1F3F6" stroke="#7C8596" stroke-width="1.8"/><text x="1320" y="437.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Na reciclagem</text><text x="1320" y="456.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">apagado: true</text><text x="1320" y="473.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">o ficheiro continua no MinIO</text><rect x="1170.0" y="591.0" width="300" height="98" rx="12" fill="#F8E1E1" stroke="#B23A3A" stroke-width="1.8"/><text x="1320" y="627.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Eliminado</text><text x="1320" y="646.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">removido do MinIO</text><text x="1320" y="663.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">e do MongoDB</text><path d="M1280,303 L1280,399" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><text x="1268" y="355" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="end" fill="#3A4458">eliminar</text><path d="M1360,400 L1360,304" fill="none" stroke="#3C8D63" stroke-width="1.8" marker-end="url(#s3C8D63)" stroke-linejoin="round"/><text x="1372" y="355" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#3C8D63">recuperar</text><path d="M1320,500 L1320,589" fill="none" stroke="#B23A3A" stroke-width="1.8" marker-end="url(#sB23A3A)" stroke-linejoin="round"/><text x="1334" y="548" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#B23A3A">eliminar de vez</text></svg>