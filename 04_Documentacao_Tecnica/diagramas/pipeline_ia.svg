<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="s4A5568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker><marker id="r4A5568" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4A5568"/></marker><marker id="s3C8D63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3C8D63"/></marker><marker id="r3C8D63" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3C8D63"/></marker><marker id="sB23A3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B23A3A"/></marker><marker id="rB23A3A" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B23A3A"/></marker><marker id="s2F5DA8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F5DA8"/></marker><marker id="r2F5DA8" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2F5DA8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="800.0" y="52" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F2A44">Como a IA categoriza um ficheiro</text><text x="800.0" y="82" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16.5" font-weight="400" text-anchor="middle" fill="#4A5568">worker de IA em segundo plano: regras simples + modelo de aprendizagem automática</text><rect x="35.0" y="189.0" width="230" height="92" rx="12" fill="#F1F3F6" stroke="#7C8596" stroke-width="1.8"/><text x="150" y="222.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Ficheiro novo</text><text x="150" y="241.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">estado PENDENTE</text><text x="150" y="258.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">na coleção ficheiros</text><rect x="300.0" y="176.0" width="340" height="118" rx="12" fill="#FCEBD7" stroke="#B86E1F" stroke-width="1.8"/><text x="470" y="213.47500000000002" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">1. Extração</text><text x="470" y="232.32500000000002" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">PDF (pypdf), DOCX, TXT, MD, CSV e código</text><text x="470" y="249.87500000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">imagens: EXIF, dimensões e OCR</text><text x="470" y="267.425" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">PDF digitalizado: sem OCR (sem texto)</text><rect x="685.0" y="164.0" width="360" height="142" rx="12" fill="#FCEBD7" stroke="#B86E1F" stroke-width="1.8"/><text x="865" y="204.70000000000002" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">2. Regras</text><text x="865" y="223.55" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">Código: extensão (0,97)</text><text x="865" y="241.10000000000002" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">Captura: nome (0,95) ou PNG de ecrã (0,8)</text><text x="865" y="258.65000000000003" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">Fotografia: EXIF de câmara (0,92) ou nome (0,8)</text><text x="865" y="276.20000000000005" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">Fatura: 3 ou mais sinais no texto (0,9)</text><polygon points="1250,167.0 1370.0,235 1250,303.0 1130.0,235" fill="#fff" stroke="#1F2A44" stroke-width="1.8"/><text x="1250" y="230.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#1F2A44">regra com</text><text x="1250" y="249.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#1F2A44">confiança ≥ 0,9?</text><path d="M266,235 L298,235" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><path d="M641,235 L683,235" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><path d="M1046,235 L1128,235" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><rect x="1355.0" y="468.0" width="230" height="104" rx="12" fill="#DFF2E7" stroke="#3C8D63" stroke-width="1.8"/><text x="1470" y="507.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Categoria</text><text x="1470" y="526.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">+ grau de confiança</text><text x="1470" y="543.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">estado CATEGORIZADO</text><path d="M1370,235 L1470,235 L1470,466" fill="none" stroke="#3C8D63" stroke-width="2.2" marker-end="url(#s3C8D63)" stroke-linejoin="round"/><text x="1392" y="225" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#3C8D63">sim</text><path d="M1250,303 L1250,380 L450,380 L450,458" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><text x="1262" y="345" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#4A5568">não</text><rect x="275.0" y="460.0" width="350" height="120" rx="12" fill="#FCEBD7" stroke="#B86E1F" stroke-width="1.8"/><text x="450" y="498.475" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">3. Modelo</text><text x="450" y="517.325" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">TF-IDF (palavras, n-gramas de 1 e 2)</text><text x="450" y="534.875" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">entrada: nome ×2 + extensão ×2 + texto</text><text x="450" y="552.4250000000001" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">Naive Bayes ou Regressão Logística</text><rect x="700.0" y="472.0" width="300" height="96" rx="12" fill="#FCEBD7" stroke="#B86E1F" stroke-width="1.8"/><text x="850" y="507.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">4. Combinar</text><text x="850" y="526.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">se a regra for mais confiante</text><text x="850" y="543.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">que o modelo, ganha a regra</text><polygon points="1180,455.0 1295.0,520 1180,585.0 1065.0,520" fill="#fff" stroke="#1F2A44" stroke-width="1.8"/><text x="1180" y="515.8" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#1F2A44">confiança</text><text x="1180" y="534.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#1F2A44">≥ 0,6?</text><path d="M626,520 L698,520" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><path d="M1001,520 L1063,520" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#s4A5568)" stroke-linejoin="round"/><path d="M1296,520 L1353,520" fill="none" stroke="#3C8D63" stroke-width="2.2" marker-end="url(#s3C8D63)" stroke-linejoin="round"/><text x="1300" y="510" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#3C8D63">sim</text><path d="M1180,586 L1180,692" fill="none" stroke="#B23A3A" stroke-width="2.2" marker-end="url(#sB23A3A)" stroke-linejoin="round"/><text x="1192" y="640" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#B23A3A">não</text><rect x="1055.0" y="693.0" width="250" height="94" rx="12" fill="#F8E1E1" stroke="#B23A3A" stroke-width="1.8"/><text x="1180" y="727.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">«Por rever»</text><text x="1180" y="746.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">guarda o palpite da IA;</text><text x="1180" y="763.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">o utilizador decide</text><rect x="675.0" y="693.0" width="290" height="94" rx="12" fill="#DCE6F5" stroke="#2F5DA8" stroke-width="1.8"/><text x="820" y="736.025" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Correção do utilizador</text><text x="820" y="754.875" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">fica na coleção correcoes</text><rect x="300.0" y="693.0" width="300" height="94" rx="12" fill="#DCE6F5" stroke="#2F5DA8" stroke-width="1.8"/><text x="450" y="727.25" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A44">Retreino</text><text x="450" y="746.1" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">train.py --correcoes</text><text x="450" y="763.65" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#4A5568">o worker recarrega o modelo sozinho</text><path d="M1054,740 L967,740" fill="none" stroke="#2F5DA8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#s2F5DA8)" stroke-linejoin="round"/><path d="M1470,573 L1470,835 L820,835 L820,789" fill="none" stroke="#2F5DA8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#s2F5DA8)" stroke-linejoin="round"/><text x="1145" y="826" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#2F5DA8">se a categoria estiver errada</text><path d="M674,740 L602,740" fill="none" stroke="#2F5DA8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#s2F5DA8)" stroke-linejoin="round"/><path d="M450,692 L450,582" fill="none" stroke="#2F5DA8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#s2F5DA8)" stroke-linejoin="round"/><text x="462" y="640" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#2F5DA8">modelo novo</text></svg>