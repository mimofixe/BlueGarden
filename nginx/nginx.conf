worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Regista qual backend respondeu a cada pedido
    log_format bg '$remote_addr "$request" $status -> $upstream_addr ($upstream_response_time s)';
    access_log /var/log/nginx/access.log bg;

    # ---- Balanceamento entre os 3 backends ----
    # Deteção passiva de falhas: depois de 2 erros em 10 s, o backend é
    # retirado durante 10 s e os pedidos seguem para os outros.
    upstream backends {
        least_conn;
        server backend1:8000 max_fails=2 fail_timeout=10s;
        server backend2:8000 max_fails=2 fail_timeout=10s;
        server backend3:8000 max_fails=2 fail_timeout=10s;
    }

    # HTTP -> HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/bluegarden.crt;
        ssl_certificate_key /etc/nginx/certs/bluegarden.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        # Mostra qual backend respondeu (útil na demo de falhas)
        add_header X-Backend $upstream_addr always;

        client_max_body_size 50m;

        # Frontend estático
        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # API -> backends
        location /api/ {
            proxy_pass http://backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Se um backend falhar, o mesmo pedido é repetido noutro.
            # Inclui POST (non_idempotent): os uploads são seguros de repetir
            # porque o ficheiro só fica visível depois de gravado no MongoDB.
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
        }
    }
}
